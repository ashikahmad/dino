<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Dino</title>
    <meta name="description" content="A WebGL take on Chrome's offline dino game, with a day and night cycle that follows your score." />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dino" />
    <meta property="og:title" content="Dino" />
    <meta property="og:description" content="Chrome's offline dino game in WebGL, from day through dusk to night and back to dawn. Tap or press space to play." />
    <meta property="og:url" content="https://ashikahmad.github.io/dino/" />
    <meta property="og:image" content="https://ashikahmad.github.io/dino/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="One continuous dino game scene cut on a slant: daytime with a sun on the left, night with a moon and stars on the right, and the dino and cacti running across both." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dino" />
    <meta name="twitter:description" content="Chrome's offline dino game in WebGL, from day through dusk to night and back to dawn." />
    <meta name="twitter:image" content="https://ashikahmad.github.io/dino/og-image.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f7f7; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      @media (prefers-color-scheme: dark) { html, body { background: #202124; } }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; image-rendering: pixelated; }

      /* start screen and about card: one panel, shown around the canvas while idle and as an overlay on request */
      body { color: #535353; }
      @media (prefers-color-scheme: dark) { body { color: #e4e4e4; } }
      #panel { position: fixed; inset: 0; z-index: 5; display: grid; grid-template-rows: minmax(0, 1fr) var(--canvas-h, 150px) minmax(0, 1fr); justify-items: center; padding-inline: 16px; text-align: center; pointer-events: none; transition: opacity 0.35s ease; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #panel.hidden { opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0s linear 0.35s; }
      #panel.hidden.instant { transition: none; }
      #panel .top { align-self: end; display: grid; justify-items: center; gap: 10px; padding-bottom: 20px; }
      #panel .bottom { align-self: start; display: grid; justify-items: center; gap: 14px; padding-top: 20px; max-width: 560px; }
      .title { margin: 0; line-height: 0; }
      .title svg { display: block; width: max(120px, min(clamp(150px, 34vw, 300px), calc(var(--room, 200px) * 0.62 * 32 / 9))); height: auto; fill: currentColor; shape-rendering: crispEdges; }
      .tagline { margin: 0; opacity: 0.7; letter-spacing: 0.04em; }
      .how { margin: 0; opacity: 0.85; }
      .how.touch { display: none; }
      @media (pointer: coarse) { .how.keys { display: none; } .how.touch { display: block; } }
      kbd { font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; opacity: 0.8; white-space: nowrap; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid currentColor; border-radius: 999px; background: none; color: inherit; font: inherit; text-decoration: none; cursor: pointer; opacity: 0.8; pointer-events: auto; }
      .pill:hover, .pill:focus-visible { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
      .pill svg { width: 16px; height: 16px; fill: currentColor; }
      .credit { margin: 0; font-size: 12px; opacity: 0.65; }
      .credit a { color: inherit; text-underline-offset: 2px; pointer-events: auto; }
      #panel .close { display: none; position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border: 0; background: none; color: inherit; font-size: 28px; line-height: 1; cursor: pointer; opacity: 0.7; }
      #panel.overlay { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; overflow-y: auto; touch-action: pan-y; pointer-events: auto; background: var(--sky, #f7f7f7); padding-block: 24px; }
      #panel.overlay .top, #panel.overlay .bottom { padding: 0; align-self: center; }
      #panel.overlay .spacer { display: none; }
      #panel.overlay .close { display: block; }
      /* how much room there is above and below the canvas decides what the start screen shows (set in main.ts) */
      #panel[data-room="compact"]:not(.overlay) :is(.tagline, .credit, .hint) { display: none; }
      #panel[data-room="compact"]:not(.overlay) .bottom { gap: 8px; padding-top: 12px; }
      #panel[data-room="compact"]:not(.overlay) .pill { padding: 5px 12px; font-size: 13px; }
      #panel[data-room="tight"]:not(.overlay) :is(.tagline, .actions, .credit, .hint) { display: none; }
      #panel[data-room="tight"]:not(.overlay) .bottom { align-self: center; padding-top: 0; }
      #panel[data-room="tight"]:not(.overlay) .how { font-size: 13px; }
      #panel[data-room="tight"]:not(.overlay) .top { padding-bottom: 6px; margin-bottom: min(0px, calc(var(--room, 200px) - 44px)); }
      @media (prefers-reduced-motion: reduce) { #panel, #panel.hidden { transition: none; } }
      #fs .exit { display: none; }
      #fs[aria-pressed="true"] .enter { display: none; }
      #fs[aria-pressed="true"] .exit { display: block; }
      .hint { margin: 0; font-size: 12px; opacity: 0.65; }
      #bar { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); z-index: 4; display: flex; }
      #bar button { width: 40px; height: 40px; padding: 8px; border: 0; background: none; color: inherit; opacity: 0.55; cursor: pointer; }
      #bar button:hover, #bar button:focus-visible { opacity: 0.9; }
      #bar button[hidden] { display: none; }
      #bar svg { display: block; width: 100%; height: 100%; }
      #mute .off { display: none; }
      #mute[aria-pressed="true"] .on { display: none; }
      #mute[aria-pressed="true"] .off { display: block; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="bar">
      <button id="info" type="button" tabindex="-1" aria-label="About this game" title="About (I)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2" /><rect x="11" y="10.5" width="2" height="7" fill="currentColor" /><rect x="11" y="6.5" width="2" height="2.2" fill="currentColor" /></svg>
      </button>
      <button id="mute" type="button" tabindex="-1" aria-label="Sound" aria-pressed="false" title="Sound on/off (M)">
        <svg class="on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9h4l5-4v14l-5-4H3z" /><path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <svg class="off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9h4l5-4v14l-5-4H3z" /><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button id="fs" type="button" tabindex="-1" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen (F)" hidden>
        <svg class="enter" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
        <svg class="exit" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" /></svg>
      </button>
    </div>
    <div id="panel" role="dialog" aria-label="About Dino">
      <button class="close" id="close" type="button" aria-label="Close">&times;</button>
      <div class="top">
        <h1 class="title"><svg viewBox="0 0 32 9" role="img" aria-label="Dino"><path d="M0 0h6v1h-6zM0 1h2v1h-2zM4 1h3v1h-3zM0 2h2v1h-2zM5 2h2v1h-2zM0 3h2v1h-2zM5 3h2v1h-2zM0 4h2v1h-2zM5 4h2v1h-2zM0 5h2v1h-2zM5 5h2v1h-2zM0 6h2v1h-2zM5 6h2v1h-2zM0 7h2v1h-2zM4 7h3v1h-3zM0 8h6v1h-6zM9 0h5v1h-5zM11 1h2v1h-2zM11 2h2v1h-2zM11 3h2v1h-2zM11 4h2v1h-2zM11 5h2v1h-2zM11 6h2v1h-2zM11 7h2v1h-2zM9 8h5v1h-5zM16 0h2v1h-2zM21 0h2v1h-2zM16 1h3v1h-3zM21 1h2v1h-2zM16 2h4v1h-4zM21 2h2v1h-2zM16 3h2v1h-2zM19 3h4v1h-4zM16 4h2v1h-2zM20 4h3v1h-3zM16 5h2v1h-2zM21 5h2v1h-2zM16 6h2v1h-2zM21 6h2v1h-2zM16 7h2v1h-2zM21 7h2v1h-2zM16 8h2v1h-2zM21 8h2v1h-2zM26 0h5v1h-5zM25 1h2v1h-2zM30 1h2v1h-2zM25 2h2v1h-2zM30 2h2v1h-2zM25 3h2v1h-2zM30 3h2v1h-2zM25 4h2v1h-2zM30 4h2v1h-2zM25 5h2v1h-2zM30 5h2v1h-2zM25 6h2v1h-2zM30 6h2v1h-2zM25 7h2v1h-2zM30 7h2v1h-2zM26 8h5v1h-5z" /></svg></h1>
        <p class="tagline">Run through day and night.</p>
      </div>
      <div class="spacer"></div>
      <div class="bottom">
        <p class="how keys"><kbd>Space</kbd> or <kbd>&uarr;</kbd> to jump &middot; <kbd>&darr;</kbd> to duck &middot; <kbd>M</kbd> sound</p>
        <p class="how touch">Tap to jump &middot; swipe down to duck</p>
        <p class="hint" id="ios-hint" hidden>For fullscreen on iPhone: tap Share, then Add to Home Screen.</p>
        <div class="actions">
          <button class="pill" id="share" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4.5 4.5-1.4 1.4L13 6.8V15h-2V6.8L8.9 8.9 7.5 7.5 12 3zM5 11h2v8h10v-8h2v10H5V11z" /></svg><span id="share-label" aria-live="polite">Share</span></button>
          <a class="pill" id="github" href="https://github.com/ashikahmad/dino" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" /></svg>GitHub</a>
        </div>
        <p class="credit"><span id="version">v1.0.0</span> &middot; Made by <a href="https://github.com/ashikahmad" target="_blank" rel="noopener">Ashik uddin Ahmad</a> with <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a><br />Game design and sprites from <a href="https://source.chromium.org/chromium/chromium/src/+/main:components/neterror/resources/dino_game/" target="_blank" rel="noopener">Chromium&rsquo;s offline dino game</a> (BSD-3-Clause)</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
